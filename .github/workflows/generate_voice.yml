name: Generate Clone Voice

on:
  push:
    branches:
      - main
    paths:
      - '**/index.html'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install voxcpm soundfile resampy requests

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python sync_voices.py
      # 註：sync_voices.py 每產生一個 voice.mp3 就直接以 GitHub API 上傳（見其 upload_file），
      # 因此不需要再 commit/push。原本的「Commit and Push changes」步驟因 checkout 落後於
      # 腳本推進後的遠端，每次都以 non-fast-forward 失敗，讓整個 run 被標成 failure，故移除。
