name: Generate Clone Voice

on:
  # 2026-11-09 移除 push 觸發。本機 GPU 一筆約 32 秒，雲端 CPU 一筆約 20 分鐘，
  # 兩邊會搶同一批缺語音的物件：這天上架 98 筆後，本 workflow 被 push 叫起來
  # 跑了 4 小時 43 分、生成 14 筆並逐筆以 API 推上去（w1000–w1021），
  # 本機批次同時也生成了同樣那 14 筆，造成 14 個二進位檔衝突要人工收。
  # 雲端保留作「沒有 NVIDIA 顯卡」時的後路，但只能手動觸發。
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install voxcpm soundfile resampy requests

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python sync_voices.py
      # 註：sync_voices.py 每產生一個 voice.mp3 就直接以 GitHub API 上傳（見其 upload_file），
      # 因此不需要再 commit/push。原本的「Commit and Push changes」步驟因 checkout 落後於
      # 腳本推進後的遠端，每次都以 non-fast-forward 失敗，讓整個 run 被標成 failure，故移除。
